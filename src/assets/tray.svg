<svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Menu-bar tray glyph: an outlined shield with an outlined keyhole (the Keeper mark).
       Line art, not a silhouette — at menu-bar size a solid fill reads as an undifferentiated
       lump. Black on transparent so macOS renders it as a template image (white on the dark
       menu bar, black in light mode); the stroke colour is discarded, only alpha survives.

       The 24x24 viewBox and both path strings are THE SAME DRAWING as the Android status-bar
       icon (remote-browser-mobile `drawable/ic_stat_keeper.xml`) — one glyph, rendered twice.
       If either side is retouched, retouch both.

       trayTemplate.png / trayTemplate@2x.png are generated FROM THIS FILE and are what
       actually ships (see docs/file-structure.md § Icons). Regenerate them on every edit. -->
  <g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- shield outline -->
    <path d="M12 2.5 L19.5 5.3 V11 C19.5 15.6 16.3 19.2 12 20.6 C7.7 19.2 4.5 15.6 4.5 11 V5.3 Z"/>
    <!-- keyhole: ring + stem -->
    <path d="M12 8.2 m-1.9 0 a1.9 1.9 0 1 0 3.8 0 a1.9 1.9 0 1 0 -3.8 0 M12 10.1 V14.6"/>
  </g>
</svg>
