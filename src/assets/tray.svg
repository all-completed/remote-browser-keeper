<svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Menu-bar tray glyph: a solid shield with the keyhole cut out (even-odd fill).
       Black on transparent so macOS renders it as a template image (white on the dark
       menu bar, black in light mode); the fill colour is discarded, only alpha survives.

       Solid, not line art. An outlined version shipped briefly and was rejected on sight
       at menu-bar size: the two thin concentric strokes (shield edge + keyhole ring)
       fight each other in 16 px, while the silhouette reads instantly. See issue #5.

       The 24x24 viewBox and the path string are copied VERBATIM from the canonical glyph
       in remote-browser-mobile (`branding/glyph-shield-keeper.svg`, shipped on Android as
       `drawable/ic_stat_keeper.xml`) — one glyph, rendered twice. Mobile is the source of
       truth: retouch it there first, then copy the `d` string back here.

       trayTemplate.png / trayTemplate@2x.png are generated FROM THIS FILE and are what
       actually ships (see docs/file-structure.md § Icons). Regenerate them on every edit. -->
  <path fill="#000" fill-rule="evenodd" d="
    M12 1.35 L21 4.5 V12 C21 18 12 22.65 12 22.65 C12 22.65 3 18 3 12 V4.5 Z
    M12 6.9 C10.275 6.9 8.925 8.25 8.925 9.9 C8.925 11.025 9.525 12 10.425 12.6 L9.525 16.65 H14.475 L13.575 12.6 C14.475 12 15.075 11.025 15.075 9.9 C15.075 8.25 13.725 6.9 12 6.9 Z"/>
</svg>
